# Configuración de Netlify: compila el sitio y publica la carpeta prerenderizada.
# Las cabeceras de seguridad y de caché salen de dist/.../_headers (lo genera scripts/postbuild.mjs).
[build]
  command = "npm run build"
  publish = "dist/dragones-club/browser"

[build.environment]
  NODE_VERSION = "24"
