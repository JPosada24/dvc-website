<section id="inicio" class="hero">
  <div class="hero-watermark" aria-hidden="true"><span>DRAGONES</span></div>
  <div class="hero-grid">
    <div class="hero-copy">
      <div class="hero-badge">
        <div class="line"></div>
        <span class="kicker">Voleibol · Formación y competencia</span>
      </div>
      <h1>Despierta el<br /><span class="text-fire text-glow">fuego interior</span></h1>
      <p class="lead">
        Escuela y equipos de voleibol para todas las edades. Disciplina, técnica y carácter dentro y
        fuera de la cancha.
      </p>
      <div class="hero-actions">
        <a href="#inscripcion" class="btn btn-fire"><span>Agenda tu prueba</span></a>
        <a href="#categorias" class="btn btn-outline"><span>Ver categorías</span></a>
      </div>
    </div>
    <div class="hero-media">
      <div class="hero-frame">
        <div class="skewbox">
          <picture>
            <source
              type="image/webp"
              srcset="img/equipo-600.webp 600w, img/equipo-800.webp 800w, img/equipo-1280.webp 1280w, img/equipo-1920.webp 1920w"
              sizes="(min-width: 1100px) 600px, (min-width: 768px) 640px, calc(100vw - 64px)"
            />
            <img
              src="img/equipo-1920.jpg"
              srcset="img/equipo-600.jpg 600w, img/equipo-800.jpg 800w, img/equipo-1280.jpg 1280w, img/equipo-1920.jpg 1920w"
              sizes="(min-width: 1100px) 600px, (min-width: 768px) 640px, calc(100vw - 64px)"
              alt="Jugadores y jugadoras del Club Deportivo Dragones reunidos después de un entrenamiento"
              width="1920"
              height="1440"
              fetchpriority="high"
            />
          </picture>
        </div>
        <div class="corner-tr" aria-hidden="true"></div>
        <div class="corner-bl" aria-hidden="true"></div>
      </div>
    </div>
  </div>
</section>
