<footer>
  <div class="footer-inner">
    <div class="footer-brand">
      <img src="img/logo-96.png" alt="" width="32" height="32" loading="lazy" />
      <span>Club Deportivo Dragones</span>
    </div>
    @if (redes().length) {
      <ul class="footer-links">
        @for (r of redes(); track r.red) {
          <li><a [href]="r.href" [attr.target]="r.red === 'Correo' ? null : '_blank'" rel="noopener noreferrer" [attr.aria-label]="r.red + ': ' + r.label">{{ r.label }}</a></li>
        }
      </ul>
    }
    <span class="footer-copy">© 2026 · Voleibol</span>
  </div>
</footer>
