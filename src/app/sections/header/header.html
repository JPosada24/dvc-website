<a class="skip-link" href="#contenido">Saltar al contenido</a>

<header class="site-header">
  <nav class="nav" aria-label="Principal">
    <a href="#inicio" class="brand" (click)="closeMenu()">
      <img src="img/logo-96.png" alt="" width="40" height="40" />
      <span class="brand-name">Club Deportivo <span class="text-fire">Dragones</span></span>
    </a>

    <div class="nav-links">
      @for (link of links; track link.id) {
        <a
          [href]="'#' + link.id"
          [class.active]="activeId() === link.id"
          [attr.aria-current]="activeId() === link.id ? 'location' : null"
          >{{ link.label }}</a
        >
      }
    </div>

    <a href="#inscripcion" class="btn btn-fire nav-cta"><span>Unirse</span></a>

    <button
      type="button"
      class="menu-toggle"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="menu-movil"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
      (click)="toggleMenu()"
    >
      <span class="bars" aria-hidden="true"><span></span><span></span><span></span></span>
    </button>
  </nav>
</header>

<div id="menu-movil" class="mobile-menu" [attr.inert]="menuOpen() ? null : ''">
  <div class="mobile-links">
    @for (link of links; track link.id; let i = $index) {
      <a
        [href]="'#' + link.id"
        [class.active]="activeId() === link.id"
        [attr.aria-current]="activeId() === link.id ? 'location' : null"
        [style.--i]="i"
        (click)="closeMenu()"
      >
        <span class="idx" aria-hidden="true">0{{ i + 1 }}</span>{{ link.label }}
      </a>
    }
  </div>
  <a href="#inscripcion" class="btn btn-fire mobile-cta" (click)="closeMenu()"><span>Unirse al club</span></a>
</div>
